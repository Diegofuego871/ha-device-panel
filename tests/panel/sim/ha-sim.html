<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- wie im HA-Frontend -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Dunkles Design wie HA es per Variablen am <html> setzt */
  html {
    --primary-background-color: #111111;
    --secondary-background-color: #282828;
    --card-background-color: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --disabled-text-color: #6f6f6f;
    --divider-color: rgba(225, 225, 225, 0.12);
    --error-color: #ef5350;
    --primary-color: #03a9f4;
    --success-color: #43a047;
    --warning-color: #ff9800;
    --header-height: 56px;
    --sim-safe-top: 47px; /* simuliert den iPhone-Safe-Area-Abstand */
  }
  html, body { margin: 0; height: 100%; background: var(--primary-background-color); }
  /* Helles Design über ?theme=light */
  html.light {
    --primary-background-color: #fafafa;
    --secondary-background-color: #e5e5e5;
    --card-background-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --disabled-text-color: #bdbdbd;
    --divider-color: rgba(0, 0, 0, 0.12);
    --error-color: #db4437;
  }
  /* Nachbau von hass-subpage im narrow-Modus: fix über den ganzen Viewport,
     Kopfzeile oben (mit Safe-Area-Abstand), iframe füllt den Rest */
  .subpage { position: fixed; inset: 0; display: block; }
  .sim-toolbar {
    padding-top: var(--sim-safe-top);
    height: var(--header-height);
    display: flex; align-items: center; gap: 12px; padding-left: 12px;
    color: var(--primary-text-color); font-family: sans-serif; font-size: 20px;
    border-bottom: 1px solid var(--divider-color);
    box-sizing: content-box;
  }
  .sim-content {
    height: calc(100% - var(--header-height) - var(--sim-safe-top) - 1px);
  }
  iframe { border: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<home-assistant>
  <div class="subpage">
    <div class="sim-toolbar"><span id="sim-menu">☰</span><span>Device Panel</span></div>
    <div class="sim-content">
      <!-- exakt HAs IFRAME_SANDBOX -->
      <iframe id="panel-frame"
        title="Device Panel"
        sandbox="allow-forms allow-popups allow-pointer-lock allow-same-origin allow-scripts allow-modals allow-downloads"
        allow="fullscreen"></iframe>
    </div>
  </div>
</home-assistant>
<script>
  // Erfundene Geräte (nie echte Namen, IPs oder Orte verwenden).
  const now = Date.now();
  const nowS = now / 1000;
  const H = 3600;
  const D = 86400;
  const ago = (min) => new Date(now - min * 60000).toISOString();

  // Erfundener Verlauf je Gerät: Unterbrüche [vor Sekunden, Dauer] (Dauer
  // gleich "vor" = läuft noch), Lücken ohne Daten (HA aus), Daten seit.
  // Liste, Popup und Statistik-Fenster rechnen alle daraus, wie das Backend.
  const HIST = {
    a: { since: 40 * D, outages: [[4560 * 60, 4560 * 60]] },
    b: { since: 40 * D, outages: [[134 * 60, 134 * 60], [11 * H, 7 * 60], [3 * D, 20 * 60], [9 * D, 45 * 60]] },
    // Zwei Neustarts während des laufenden Ausfalls (gapsOff): ein Unterbruch.
    c: { since: 40 * D, outages: [[47 * 60, 47 * 60], [2 * D + 5 * H, 15 * 60]], gaps: [[6 * D, 2 * H]], gapsOff: [[30 * 60, 3 * 60], [15 * 60, 2 * 60]] },
    d: { since: 40 * D, outages: [[6 * 60, 6 * 60]] },
    e: { since: 40 * D, outages: [[2 * H, 4 * 60], [5 * H, 6 * 60], [11 * H, 5 * 60], [16 * H, 3 * 60], [20 * H, 9 * 60], [4 * D, 10 * 60]] },
    f: { since: 40 * D, outages: [[3 * H, 3 * 60], [8 * H, 4 * 60], [14 * H, 3 * 60]] },
    l: { since: 40 * D, outages: [[18 * H, 6 * 60]] },
    m: { since: 40 * D, outages: [[11 * H, 8 * 60]] },
    // Erst seit 2 Std. im Protokoll: das Statistik-Fenster zoomt.
    o: { since: 2 * H, outages: [] },
    // Erst seit 40 Min.: Prozent noch "–" (ab 1 Std. Daten).
    k: { since: 40 * 60, outages: [] },
  };
  const OFFLINE = 0;
  const ONLINE = 1;

  function events(id) {
    const h = HIST[id] || { since: 40 * D, outages: [] };
    const list = [[nowS - h.since, ONLINE]];
    for (const [a, dur] of h.outages) {
      list.push([nowS - a, OFFLINE]);
      if (dur < a) list.push([nowS - a + dur, ONLINE]);
    }
    for (const [a, dur] of h.gaps || []) list.push([nowS - a, null], [nowS - a + dur, ONLINE]);
    for (const [a, dur] of h.gapsOff || []) list.push([nowS - a, null], [nowS - a + dur, OFFLINE]);
    return list.sort((x, y) => x[0] - y[0]);
  }
  // Wie availability.bridged: "keine Daten" zwischen zwei Ausfällen fällt weg.
  function bridged(evs) {
    const out = [];
    evs.forEach((e, i) => {
      if (e[1] === null && out.length && out[out.length - 1][1] === OFFLINE && i + 1 < evs.length && evs[i + 1][1] === OFFLINE) return;
      out.push(e);
    });
    return out;
  }

  // Wie availability.segments/summarize/strip im Backend.
  function segments(evs, start, end) {
    const out = [];
    let state = null;
    let cursor = start;
    for (const [at, st] of evs) {
      if (at <= start) { state = st; continue; }
      if (at >= end) break;
      if (at > cursor) out.push([cursor, at, state]);
      cursor = at;
      state = st;
    }
    if (end > cursor) out.push([cursor, end, state]);
    const merged = [];
    for (const s of out) {
      const last = merged[merged.length - 1];
      if (last && last[2] === s[2] && last[1] === s[0]) last[1] = s[1];
      else merged.push(s);
    }
    return merged;
  }
  function summarize(segs) {
    const on = segs.filter((s) => s[2] === ONLINE).reduce((a, s) => a + s[1] - s[0], 0);
    const offs = segs.filter((s) => s[2] === OFFLINE);
    const off = offs.reduce((a, s) => a + s[1] - s[0], 0);
    if (on + off <= 0) return null;
    let pct = (on / (on + off)) * 100;
    if (offs.length && pct > 99.9) pct = 99.9;
    return {
      // Wie das Backend: Anteil erst ab 1 Std. Daten.
      pct: on + off >= 3600 ? Math.round(pct * 10) / 10 : null, outages: offs.length, offline: Math.round(off), covered: Math.round(on + off),
      longest: Math.round(Math.max(0, ...offs.map((s) => s[1] - s[0]))),
    };
  }
  function strip(segs, start, end, n = 48) {
    const size = (end - start) / n;
    return Array.from({ length: n }, (_, i) => {
      const a = start + i * size;
      const b = a + size;
      let off = 0;
      let none = 0;
      for (const [sa, sb, st] of segs) {
        const o = Math.min(b, sb) - Math.max(a, sa);
        if (o <= 0) continue;
        if (st === OFFLINE) off += o;
        else if (st === null) none += o;
      }
      return off > 0 ? 1 : none > size / 2 ? 2 : 0;
    });
  }
  const RANGES = { "24h": D, "7d": 7 * D, "30d": 30 * D, "90d": 90 * D, "180d": 180 * D, "365d": 365 * D };
  function availHistory(id, range) {
    const end = Date.now() / 1000;
    const span = RANGES[range];
    const start = end - span;
    const evs = events(id);
    const segs = segments(evs, start, end);
    const counted = segments(bridged(evs), start, end);
    const days = [];
    if (span > D) {
      const midnight = new Date(end * 1000);
      midnight.setHours(0, 0, 0, 0);
      for (let i = span / D - 1; i >= 0; i--) {
        const ds = new Date(midnight); ds.setDate(ds.getDate() - i);
        const de = new Date(ds); de.setDate(de.getDate() + 1);
        const dsegs = segments(evs, ds / 1000, Math.min(end, de / 1000));
        const off = segments(bridged(evs), ds / 1000, Math.min(end, de / 1000)).filter((s) => s[2] === OFFLINE);
        days.push({ start: ds / 1000, outages: off.length, offline: Math.round(off.reduce((a, s) => a + s[1] - s[0], 0)), nodata: dsegs.every((s) => s[2] === null) });
      }
    }
    const outages = counted.filter((s) => s[2] === OFFLINE).map(([a, b]) => [a, b]);
    return { start, end, first: evs[0] ? evs[0][0] : null, segments: segs, outages, summary: summarize(counted), days };
  }
  // Wie das Backend: Zahlen über Lücken als ein Ausfall, der Streifen zeigt,
  // was HA beobachtet hat.
  // Erfundener Batterie-Verlauf wie das Backend (battery_history.py):
  // Fensterkontakt Küche (e) vor 74 Tagen von 12 % auf 100 % gewechselt,
  // sonst langsam sinkend. 30 Tage und 3 Monate als Stundenmittel aus der
  // Langzeitstatistik, sonst aus dem Verlauf.
  window.__batSource = null;
  // Prognose wie battery_history.forecast: Gerade durch die Tagesmittel seit dem
  // letzten Wechsel (sonst ab 365 Tagen zurück), bis zur Warnschwelle (ohne: 0 %).
  // __batForecast erzwingt eine Antwort (Objekt) für die Zustände des Panels.
  window.__batForecast = null;
  function batForecast(valueAt, end, changeAt, threshold) {
    const target = threshold == null ? 0 : threshold;
    const base = { target, target_is_zero: threshold == null, after_change: Boolean(changeAt) };
    const from = changeAt ? changeAt + 3 * 3600 : end - 365 * D;
    base.since = changeAt || from;
    const xs = [];
    const ys = [];
    for (let t = from - (from % D) + D / 2; t < end; t += D) {
      xs.push((t - end) / D);
      ys.push(valueAt(t));
    }
    const span = xs.length ? xs[xs.length - 1] - xs[0] : 0;
    base.days_used = Math.round(span * 10) / 10;
    if (xs.length < 5 || span < 7) return { ...base, status: "short", min_days: 7 };
    const n = xs.length;
    const mx = xs.reduce((a, b) => a + b, 0) / n;
    const my = ys.reduce((a, b) => a + b, 0) / n;
    const sxx = xs.reduce((a, x) => a + (x - mx) ** 2, 0);
    const b = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / sxx;
    const a = my - b * mx;
    const ssr = xs.reduce((s, x, i) => s + (ys[i] - (a + b * x)) ** 2, 0);
    const sst = ys.reduce((s, y) => s + (y - my) ** 2, 0);
    const r2 = sst > 0 ? 1 - ssr / sst : 0;
    const se = Math.sqrt(ssr / (n - 2) / sxx);
    const last = ys[n - 1];
    base.current = Math.round(a * 10) / 10;
    base.per_month = Math.round(-b * 30.44 * 100) / 100;
    if (last <= target) return { ...base, status: "reached" };
    if (b > -0.01 || -b * span < 2) return { ...base, status: "flat" };
    const left = (a > target ? a : last) - target;
    const eta = left / -b;
    const low = b - se < 0 ? left / -(b - se) : null;
    const high = b + se < 0 ? left / -(b + se) : null;
    let confidence = span >= 60 && r2 >= 0.8 ? "high" : span >= 21 && r2 >= 0.5 ? "medium" : "low";
    if (confidence === "high" && new Set(ys.map(Math.round)).size < 8) confidence = "medium";
    return { ...base, status: "ok", days: Math.round(eta * 10) / 10, at: Math.round(end + eta * D), days_low: low == null ? null : Math.round(low * 10) / 10,
      days_high: high == null ? null : Math.round(high * 10) / 10, confidence, r2: Math.round(r2 * 100) / 100, accelerating: false };
  }
  function batteryHistory(d, range) {
    const days = { "24h": 1, "7d": 7, "30d": 30, "90d": 90, "180d": 180, "365d": 365 }[range];
    const end = Date.now() / 1000;
    const start = end - days * D;
    const level = d.battery.level;
    const changeAt = d.id === "e" ? end - 74 * D : null;
    const value = (t) => {
      const wobble = Math.sin(t / 5400) * 0.6;
      if (changeAt && t < changeAt) return Math.min(40, 12 + ((changeAt - t) / D) * 0.2) + wobble;
      const from = changeAt || end - 400 * D;
      const rate = (100 - level) / ((end - from) / D);
      return Math.min(100, level + rate * (end - t) / D) + wobble;
    };
    // 6 und 12 Monate (seit 0.29.0): Tagesmittel
    const daily = days >= 180;
    const step = daily ? D : days >= 30 ? H : days === 7 ? 2 * H : H;
    const points = [];
    for (let t = start + (daily ? D / 2 : days >= 30 ? H / 2 : 0); t < end; t += step) points.push([Math.round(t), Math.round(value(t) * 10) / 10]);
    points.push([Math.round(end), level]);
    const changes = changeAt && changeAt >= start ? [{ at: Math.round(changeAt), from: 12, to: 100 }] : [];
    const own = window.__devSettings.battery[d.id];
    const dom = d.integration?.domain;
    const integ = (window.__opts.battery_low_integrations || {})[dom];
    const threshold = own === "off" || (own == null && integ === "off") ? null : Number.isInteger(own) ? own : integ ?? window.__opts.battery_low;
    const source = window.__batSource || (days >= 30 ? "statistics" : "history");
    const forecast = window.__batForecast || batForecast(value, end, changeAt, threshold);
    return { entity_id: `sensor.${d.id}_batterie`, start, end, source, points, first: points[0][0], changes, threshold, period: daily ? "day" : "hour", forecast };
  }
  // Empfangsverlauf wie signal_history.py (erfunden, gleichbleibend):
  // Zigbee (wie ZHA) und Bluetooth aus der eigenen Aufzeichnung (Blöcke mit
  // Median, Schlechtestem, Bestem, Lücken), WLAN und Z-Wave aus dem Recorder
  // (Zustandswechsel; 30 Tage aus der Statistik). __sigSource erzwingt eine
  // Quelle ("none" = leer, "log-empty" = Aufzeichnung ohne Werte; seit 0.27.0
  // "not-recorded"/"not-recorded-empty" = Sensor, den der Recorder nicht
  // aufzeichnet, "steady" = Recorder ohne Zeile, Wert seit 3 Tagen gleich).
  window.__sigSource = null;
  // Wer das Bluetooth-Gerät gerade hört (ble_listeners): stärkster zuerst, "used" = Empfänger des angezeigten Werts. __listeners überschreibt;
  // jeder Abruf lässt das Alter um 5 s wachsen, damit die Live-Zeile im Test sichtbar weiterläuft.
  let listenerCalls = 0;
  function listenersFor(d) {
    if (d.connection !== "ble") return [];
    const rows = window.__listeners || [{ name: "Storen Büro", rssi: -76, age: 8, used: true }, { name: "Küche", rssi: -97, age: 3, used: false }];
    return rows.map((r) => ({ ...r, age: r.age + 5 * listenerCalls }));
  }
  // Weg des Bluetooth-Empfangs wie SignalLog.via_summary: Abschnitte [von, bis, Nr. | null], Empfänger mit Anteil und Ø, Wechsel (neueste zuerst).
  const VIA_NAMES = ["Storen Büro", "Proxy Garage", "Küche", "Bluetooth-Adapter (HA)"];
  function viaFor(range, start, end, points) {
    const plan = { "24h": [[22, 0], [8, 1], [38, 0], [4, null], [28, 2]], "7d": [[40, 0], [6, 1], [18, 2], [3, null], [26, 0], [7, 3]], "30d": [[55, 0], [12, 2], [4, null], [20, 0], [9, 3]] }[["90d", "180d", "365d"].includes(range) ? "30d" : range];
    const segments = [];
    let at = start;
    for (const [w, k] of plan) {
      const to = at + ((end - start) * w) / 100;
      segments.push([Math.round(at), Math.round(to), k]);
      at = to;
    }
    segments[segments.length - 1][1] = Math.round(end);
    const used = [...new Set(segments.map((x) => x[2]).filter((k) => k != null))].sort((a, b) => a - b);
    const secs = (k) => segments.filter((x) => x[2] === k).reduce((a, x) => a + x[1] - x[0], 0);
    const known = used.reduce((a, k) => a + secs(k), 0);
    const shares = used.map((k) => Math.round((secs(k) / known) * 100));
    shares[shares.indexOf(Math.max(...shares))] += 100 - shares.reduce((a, b) => a + b, 0);
    const changes = [];
    for (let i = 1; i < segments.length; i++) if (segments[i][2] != null && segments[i - 1][2] != null) changes.push([segments[i][0], segments[i - 1][2], segments[i][2]]);
    return {
      since: Math.round(end - 9 * D),
      receivers: used.map((k, i) => ({ name: VIA_NAMES[k], seconds: secs(k), share: shares[i], avg: [-74, -82, -78, -88][k] })),
      segments: segments.map(([a, b, k]) => [a, b, k == null ? null : used.indexOf(k)]),
      changes: changes.reverse().map(([t, f, to]) => [t, used.indexOf(f), used.indexOf(to)]).slice(0, 6),
    };
  }
  function signalHistory(d, range) {
    const span = { "24h": 1, "7d": 7, "30d": 30, "90d": 90, "180d": 180, "365d": 365 }[range] * D;
    const end = Date.now() / 1000;
    const start = end - span;
    const sig = d.signal;
    const kind = sig?.kind || null;
    const forced = window.__sigSource || "";
    const reason = forced.startsWith("not-recorded") ? "not_recorded" : null;
    const base = { kind, current: d.online === false || !sig ? null : sig.value, start, end, bucket: null, points: [], first: null, entity_id: null, source: "none", reason, steady_since: null };
    if (!sig || forced === "none") return base;
    if (forced === "steady") {
      // Wie battery_history.held: Linie ab der letzten Änderung (höchstens ab Beginn)
      const since = end - 3 * D;
      return { ...base, source: "history", entity_id: `sensor.${d.id}_signal`, points: [[Math.max(start, since), sig.value], [end, sig.value]], first: Math.max(start, since), steady_since: since };
    }
    const logged = ["log-empty", "log", "not-recorded", "not-recorded-empty"].includes(forced) || (!forced && ["zigbee", "ble"].includes(d.connection));
    const seed = [...d.id].reduce((a, c) => a + c.charCodeAt(0), 0);
    const wave = (t) => Math.sin(t / 7200 + seed) * (kind === "dbm" ? 4 : 18) + Math.sin(t / 900 + seed * 2) * (kind === "dbm" ? 2 : 8);
    const clamp = (v) => (kind === "dbm" ? Math.max(-110, Math.min(-30, v)) : Math.max(1, Math.min(255, v)));
    if (logged) {
      const bucket = range === "24h" ? 300 : ["90d", "180d", "365d"].includes(range) ? 86400 : 3600;
      if (forced === "log-empty" || forced === "not-recorded-empty") return { ...base, bucket };
      const points = [];
      // Aufzeichnung seit 9 Tagen; offline: nichts seit dem Ausfall; eine Lücke vor 6 Std.
      const first = end - 9 * D;
      const offFrom = d.offline_since ? Date.parse(d.offline_since) / 1000 : Infinity;
      for (let t = Math.max(start, first) - (Math.max(start, first) % bucket); t < end; t += bucket) {
        if (t >= offFrom || (t > end - 6 * 3600 && t < end - 5 * 3600)) continue;
        const med = clamp(Math.round(sig.value + wave(t)));
        const spread = kind === "dbm" ? 3 + (seed % 4) : 10 + (seed % 15);
        points.push([t + bucket / 2, med, clamp(med - spread), clamp(med + Math.round(spread / 2))]);
      }
      return { ...base, source: points.length ? "log" : "none", bucket, points, first, via: d.connection === "ble" && !window.__viaOff ? viaFor(range, start, end, points) : null, listeners: listenersFor(d), smoothed: d.connection === "ble" };
    }
    const stats = ["30d", "90d", "180d", "365d"].includes(range);
    const points = [];
    if (stats) {
      // Stundenmittel: nur die langsame Welle (die schnelle mittelt sich weg).
      for (let t = start - (start % 3600) + 1800; t < end; t += 3600) points.push([t, Math.round(clamp(sig.value + Math.sin(t / 43200 + seed) * (kind === "dbm" ? 4 : 18)) * 10) / 10]);
    } else {
      // Zustandswechsel unregelmässig, etwa alle 20 bis 90 Min.
      let t = start;
      let i = 0;
      while (t < end) {
        points.push([Math.round(t), clamp(Math.round(sig.value + wave(t)))]);
        t += 1200 + ((seed * 37 + i * 53) % 4200);
        i += 1;
      }
    }
    if (base.current != null) points.push([end, base.current]);
    return { ...base, source: stats ? "statistics" : "history", entity_id: `sensor.${d.id}_signal`, points, first: points[0][0] };
  }
  function avail24(id) {
    const s = summarize(segments(bridged(events(id)), nowS - D, nowS));
    const segs = segments(events(id), nowS - D, nowS);
    // "down": gerade ausgefallen laut Protokoll (wie availability.down_now).
    const last = segs[segs.length - 1];
    return s ? { ...s, strip: strip(segs, nowS - D, nowS), down: !!last && last[2] === OFFLINE && last[1] >= nowS - 1e-6 } : null;
  }

  // Etagen und Bereiche (erfunden) in der Reihenfolge, die man in HA
  // festlegt (Einstellungen → Bereiche, Etagen und Zonen); wie
  // devices.area_catalog. "Terrasse" ohne Etage, "Garage" ohne Geräte.
  const FLOORS = [
    { id: "eg", name: "Erdgeschoss", level: 0 }, { id: "og", name: "Obergeschoss", level: 1 }, { id: "ug", name: "Untergeschoss", level: -1 },
  ];
  const AREAS = [
    ["kueche", "Küche", "eg"], ["wohnzimmer", "Wohnzimmer", "eg"], ["flur", "Flur", "eg"], ["eingang", "Eingang", "eg"],
    ["bad", "Bad", "og"], ["buero", "Büro", "og"], ["kinderzimmer", "Kinderzimmer", "og"], ["estrich", "Estrich", "og"],
    ["keller", "Keller", "ug"], ["terrasse", "Terrasse", null], ["garage", "Garage", "ug"],
  ].map(([id, name, floor_id]) => ({ id, name, floor_id }));
  window.__areas = AREAS;
  window.__floors = FLOORS;
  const areaId = (name) => AREAS.find((a) => a.name === name)?.id || null;
  const dev = (id, name, area, integ, connection, type, extra = {}) => withInstall({
    id, name, area, area_id: areaId(area), integrations: [integ], integration: { domain: integ, title: TITLES[integ] || integ }, type, connection,
    service: false, disabled: false, entities: 3, online: true, offline_since: null, since_at_least: false, signal: null, via: null, battery: null,
    update: null, manufacturer: "Beispiel AG", model: "Modell " + id.toUpperCase(), sw_version: "1.0." + id.length, hw_version: null,
    // Angelegt vor 200 Tagen; "neu" wie im Backend: höchstens 3 Tage alt.
    created_at: new Date(now - 200 * D * 1000).toISOString(), new: false,

      if (msg.type === "frontend/get_user_data" || msg.type === "frontend/set_user_data") {
        let data = {};
        try {
          data = JSON.parse(sessionStorage.getItem("sim_user_data") || "{}");
        } catch {}
        if (msg.type === "frontend/get_user_data") return { value: data[msg.key] ?? null };
        if (window.__userDataFails) throw new Error(window.__userDataFails);
        data[msg.key] = msg.value;
        sessionStorage.setItem("sim_user_data", JSON.stringify(data));
        return null;
      }
      return {};
    },
  };
  // Sicherheitsprüfung gegen eingeschleustes HTML (XSS): mit PANEL_XSS=1 (Server) oder ?xss=1 bekommt jeder angezeigte Text aus dem
  // Backend (Namen, Bereiche, Modelle, Labels, Meldungstexte) ein Stück HTML angehängt, das Attribute schliesst ("') und ein Bild mit
  // onerror einfügt. Wird es irgendwo als HTML statt als Text eingesetzt, meldet onerror den Treffer an den Server (/__xss).
  if (window.__XSS_MODE || params.get("xss")) {
    const P = `"'><img src=x onerror=top.__xssHit(this)>`;
    const KEYS = new Set(["name", "name_by_user", "names", "area", "area_name", "model", "manufacturer", "integration_name", "title", "friendly_name", "label",
      "sw_version", "hw_version", "via", "via_name", "original_name", "entity_name", "device_name", "text", "message", "summary", "notes", "floor", "floor_name",
      "hub", "hub_name", "network", "network_name", "role", "detail", "reason", "what", "old", "new", "device", "assessment", "answer", "question", "release_notes",
      "body", "note", "description", "unit", "unit_of_measurement", "source", "error", "status_text", "latest_version", "installed_version", "version"]);
    const poison = (v, k) => {
      if (Array.isArray(v)) return v.map((x) => poison(x, k));
      if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([kk, vv]) => [kk, poison(vv, kk)]));
      return typeof v === "string" && KEYS.has(k) && !v.includes(P) ? v + P : v;
    };
    window.__xssHits = 0;
    window.__xssHit = (el) => { window.__xssHits++; const ctx = el && el.parentElement ? el.parentElement.outerHTML.slice(0, 600) : ""; fetch("/__xss", { method: "POST", body: ctx }).catch(() => {}); };
    const ha = document.querySelector("home-assistant").hass;
    const orig = ha.callWS;
    ha.callWS = async (msg) => poison(await orig(msg), "");
  }
  document.getElementById("panel-frame").src = "/device_panel/panel/panel.html?v=1";
</script>

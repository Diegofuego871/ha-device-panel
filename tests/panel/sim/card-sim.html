<!doctype html>
<!-- Nachbau eines Dashboards für die Karten (card.js): baut "hass" nach (states, entities, locale, user) und bindet die drei Karten ein.
     Parameter: lang=de|en, theme=light|dark, admin=1|0, state=ok|offline|missing. Nur erfundene Daten. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karten-Nachbau</title>
<style>
  body { margin: 0; padding: 16px; font-family: Roboto, sans-serif; }
  :root { --primary-background-color: #fafafa; --card-background-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0,0,0,.12); --primary-color: #03a9f4; }
  :root[data-theme="dark"] { --primary-background-color: #111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: rgba(255,255,255,.12); }
  body { background: var(--primary-background-color); color: var(--primary-text-color); }
  .stack { display: grid; gap: 16px; max-width: 1100px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
</style>
</head>
<body>
<div class="stack">
  <div class="row"><device-panel-availability-card id="a"></device-panel-availability-card><device-panel-offline-card id="o"></device-panel-offline-card></div>
  <device-panel-card id="all"></device-panel-card>
</div>
<script>
const q = new URLSearchParams(location.search);
const lang = q.get("lang") || "en";
const state = q.get("state") || "ok";
document.documentElement.dataset.theme = q.get("theme") || "light";
window.__nav = [];
const origPush = history.pushState.bind(history);
history.pushState = (...a) => { window.__nav.push(a[2]); };
window.addEventListener("location-changed", () => window.__nav.push("location-changed"));
const now = Date.now();
const iso = (minAgo) => new Date(now - minAgo * 60000).toISOString();
const pulse = Array.from({ length: 48 }, (_, i) => (state === "offline" ? (i > 30 ? 1 + (i % 3 === 0 ? 1 : 0) : 0) : 0));
const attrs = state === "offline"
  ? { total: 169, online: 166, stable: 165, flaky: 1, offline: 3, no_data: 0, no_status: 4, paused: 1, warnings: 2, avg24: 98.6, outages: 5, affected: 3,
      longest_since: iso(195), longest_at_least: false, pulse,
      offline_list: [{ name: "Beispiel Lampe", since: iso(195), at_least: false }, { name: "Beispiel Sensor", since: iso(42), at_least: false }, { name: "Beispiel Stecker", since: iso(7), at_least: true }] }
  : { total: 169, online: 169, stable: 169, flaky: 0, offline: 0, no_data: 0, no_status: 4, paused: 1, warnings: 0, avg24: 100, outages: 0, affected: 0,
      longest_since: null, longest_at_least: false, pulse, offline_list: [] };
const states = state === "missing" ? {} : { "sensor.device_panel_availability": { entity_id: "sensor.device_panel_availability", state: state === "offline" ? "98.2" : "100.0", last_updated: "2026-11-13T12:00:00Z", attributes: attrs } };
const entities = state === "missing" ? {} : { "sensor.device_panel_availability": { entity_id: "sensor.device_panel_availability", platform: "device_panel", translation_key: "availability" } };
const hass = { states, entities, locale: { language: lang }, language: lang, user: { is_admin: q.get("admin") !== "0" }, callService: () => Promise.reject(new Error("keine Dienste")) };
const root = document.createElement("home-assistant");
root.hass = hass;
document.body.append(root);
import("/device_panel/panel/card.js?v=1").then(() => {
  for (const id of ["a", "o", "all"]) { const el = document.getElementById(id); el.setConfig({}); el.hass = hass; }
  window.__ready = true;
}).catch((e) => { window.__err = String(e); });
</script>
</body>
</html>

[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    battery_guard: Wächter für Messfehler im Batteriestand eingeschaltet
filterwarnings =
    ignore::DeprecationWarning
    # Veraltete Aufrufe im eigenen Code sollen auffallen (wie bei 1.31.1); die Warnungen von Home Assistant selbst bleiben aus.
    # Später genannte Einträge gehen vor.
    error::DeprecationWarning:custom_components

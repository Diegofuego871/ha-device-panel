name: Release

# Legt das GitHub-Release zur Version in manifest.json an, mit dem passenden
# Abschnitt aus CHANGELOG.md als Release Notes. Nummern mit a/b/rc werden als
# Vorabversion ("Pre-release") markiert, sonst als neueste Version.
#
# Zwei Wege:
# - "Run workflow" auf main: legt den Tag vX.Y.Z am aktuellen Commit an.
#   Claude-Code-Sessions dürfen keine Tags pushen, können diesen Lauf aber
#   starten.
# - Tag vX.Y.Z pushen: Release zu diesem Tag.
# Gibt es das Release schon (z. B. von Hand angelegt), endet der Lauf ohne
# Änderung.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub-Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version prüfen
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/device_panel/manifest.json"))["version"])')
          tag="v$version"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF_NAME" != "main" ]; then
            echo "::error::Releases nur von main, nicht von $REF_NAME"
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME passt nicht zur Version $version in manifest.json"
            exit 1
          fi
          if echo "$version" | grep -Eq '(a|b|rc)[0-9]+$'; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Release Notes aus dem CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/changelog_section.py "$VERSION" > notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG gibt es schon, nichts zu tun"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            flag="--prerelease"
          else
            flag="--latest"
          fi
          # Fehlt der Tag, legt gh ihn am geprüften Commit an.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md $flag

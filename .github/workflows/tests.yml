name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Die Tests brauchen nur Lesezugriff auf den Code (das Token bekommt keine Schreibrechte).
permissions:
  contents: read

jobs:
  python:
    name: Python (Home Assistant)
    runs-on: ubuntu-latest
    # Ein Lauf dauert etwa 2 Minuten; hängt er, soll er nicht 6 Stunden Laufzeit verbrauchen
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Node.js (für die Prüfung der Panel-Texte)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Abhängigkeiten
        # Feste Version: ein neuer Release der Test-Bibliothek ändert die Home-Assistant-Version unter den Tests nicht mehr
        # unbemerkt. Zum Aktualisieren hier die Nummer anheben und die Tests laufen lassen.
        run: pip install pytest-homeassistant-custom-component==0.13.316

      - name: Tests
        run: python -m pytest -q

  panel:
    name: Panel (Playwright)
    runs-on: ubuntu-latest
    # Ein Lauf dauert etwa 15 Minuten; ein langsamer Runner (einmal 2 Std. 45 Min.) lässt Suiten sporadisch scheitern, ein Abbruch nach 60 Minuten meldet das früh
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tests/panel
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Abhängigkeiten
        run: npm ci

      - name: Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Suiten
        run: node run.mjs

      - name: Bildschirmfotos bei Fehlern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-screenshots
          path: tests/panel/output
